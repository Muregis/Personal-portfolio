<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Admin | Muregi</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #0d1117; color: #e5e7eb; }
    .admin-wrapper { max-width: 720px; margin: 80px auto; background: #111827; padding: 32px; border-radius: 16px; border: 1px solid #1f2937; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .admin-wrapper h1 { margin-bottom: 12px; }
    .admin-wrapper p { color: #9ca3af; }
    .form-grid { display: grid; gap: 16px; margin-top: 20px; }
    label { font-weight: 600; }
    input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #1f2937; background: #0b0f17; color: #e5e7eb; }
    button { padding: 12px 16px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .btn-save { background: linear-gradient(135deg, #3b82f6, #8b5cf6); color: white; }
    .btn-clear { background: #1f2937; color: #e5e7eb; }
    .status { margin-top: 12px; color: #a7f3d0; font-weight: 600; min-height: 20px; }
  </style>
</head>
<body>
  <div class="admin-wrapper">
    <h1>Gallery Admin</h1>
    <p>Add or clear gallery items (stored in your browser).</p>
    <div class="form-grid">
      <div>
        <label>Image URL</label>
        <input id="imgUrl" type="url" placeholder="https://...">
      </div>
      <div>
        <label>Title</label>
        <input id="imgTitle" type="text" placeholder="Gallery title">
      </div>
      <div>
        <label>Description</label>
        <textarea id="imgDesc" rows="3" placeholder="Short description (optional)"></textarea>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn-save" id="saveItem">Add to Gallery</button>
        <button class="btn-clear" id="clearAll">Clear Gallery</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>

  <script>
    const imgUrl = document.getElementById('imgUrl');
    const imgTitle = document.getElementById('imgTitle');
    const imgDesc = document.getElementById('imgDesc');
    const statusEl = document.getElementById('status');

    const getItems = () => {
      try { return JSON.parse(localStorage.getItem('galleryItems')) || []; } catch { return []; }
    };
    const setItems = (items) => localStorage.setItem('galleryItems', JSON.stringify(items));

    document.getElementById('saveItem').addEventListener('click', () => {
      if (!imgUrl.value || !imgTitle.value) {
        statusEl.textContent = 'Image URL and Title are required.';
        return;
      }
      const items = getItems();
      items.push({ image: imgUrl.value.trim(), title: imgTitle.value.trim(), desc: imgDesc.value.trim() });
      setItems(items);
      statusEl.textContent = 'Saved! Refresh the main site to see it.';
      imgUrl.value = imgTitle.value = imgDesc.value = '';
    });

    document.getElementById('clearAll').addEventListener('click', () => {
      localStorage.removeItem('galleryItems');
      statusEl.textContent = 'Gallery cleared.';
    });
  </script>
</body>
</html>
